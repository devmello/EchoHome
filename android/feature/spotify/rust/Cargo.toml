[package]
name = "vesper_spotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "JNI bridge from EchoHome's :feature:spotify to librespot (Spotify Connect receiver)"
license = "MIT"

[lib]
name = "vesper_spotify"
crate-type = ["cdylib"]

[dependencies]
# librespot 0.8.0 (crates.io, MIT), only the parts a Connect receiver needs. No audio backends
# (no ALSA / PulseAudio / rodio / cpal): PCM goes to Kotlin's AudioTrack through `sink.rs`.
# TLS: rustls + webpki roots (ring), no OpenSSL to cross-compile.
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "=0.8.0", default-features = false }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots", "with-libmdns"] }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
log = "0.4"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
debug = false
panic = "unwind"

# Vendored librespot 0.8.0 crates with small patches (see vendor/VESPER-PATCH.md):
# - discovery: report ZeroConf version 2.12.0 (current Spotify apps send an empty blob to 2.9.0),
#   and an external mDNS backend so Android's NsdManager advertises the service.
# - core: a non-Premium account ends the session instead of `std::process::exit(1)`.
[patch.crates-io]
librespot-discovery = { path = "vendor/librespot-discovery" }
librespot-core = { path = "vendor/librespot-core" }
