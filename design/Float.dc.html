<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandBy Float clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- Alarm -->
  <div style="position: absolute; left: 36px; top: 28px; display: flex; align-items: center; gap: 7px; color: {{c2}};">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>
    </svg>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;">7:00 AM</span>
  </div>

  <!-- Giant bubble digits, alternating two tones, overlapping like soft balloons -->
  <div role="img" aria-label="{{time}}" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-top: 18px; font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif; font-weight: 900; font-size: 380px; line-height: 0.78; letter-spacing: 0;">
    <sc-for list="{{glyphs}}" as="g" hint-placeholder-count="4">
      <sc-if value="{{g.colon}}" hint-placeholder-val="{{ false }}">
        <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 46px; margin: 0 4px 0 -18px; position: relative; z-index: 2;">
          <div style="width: 52px; height: 52px; border-radius: 50%; background: {{g.fill}};"></div>
          <div style="width: 52px; height: 52px; border-radius: 50%; background: {{g.fill}};"></div>
        </div>
      </sc-if>
      <sc-if value="{{g.digit}}" hint-placeholder-val="{{ true }}">
        <span aria-hidden="true" style="display: inline-block; margin-right: -0.09em; mix-blend-mode: screen; background: {{g.fill}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; transform: rotate({{g.tilt}}deg) translateY({{g.lift}}px);">{{g.ch}}</span>
      </sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"color":{"editor":"color","default":"#FF375F","options":["#FF375F","#FF9F0A","#FFD60A","#30D158","#64D2FF","#0A84FF","#BF5AF2","#FFFFFF"]},"night":{"editor":"boolean","default":false},"live":{"editor":"boolean","default":true},"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  hsl(hex) {
    let h = String(hex || '#FF375F').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let hh = 0, s = 0;
    if (mx !== mn) {
      const dd = mx - mn;
      s = l > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
      hh = mx === r ? (g - b) / dd + (g < b ? 6 : 0) : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
      hh *= 60;
    }
    return [hh, s * 100, l * 100];
  }
  tone(hsl, dh, dl) {
    return 'hsl(' + ((hsl[0] + dh + 360) % 360).toFixed(0) + ',' + hsl[1].toFixed(0) + '%,' + Math.max(0, Math.min(100, hsl[2] + dl)).toFixed(0) + '%)';
  }
  bubble(hsl, dh) {
    return 'linear-gradient(170deg, ' + this.tone(hsl, dh, 22) + ' 8%, ' + this.tone(hsl, dh, 0) + ' 48%, ' + this.tone(hsl, dh, -14) + ' 100%)';
  }
  renderVals() {
    const live = this.props.live ?? true;
    const d = new Date();
    if (!live) d.setHours(9, 41, 0, 0);
    const night = this.props.night ?? false;
    const base = this.hsl(night ? '#BE180E' : (this.props.color ?? '#FF375F'));
    const mono = base[1] < 8;
    const shift = night || mono ? 0 : 38;
    const fillA = night ? this.bubble(base, 0) : this.bubble(base, 0);
    const fillB = night ? this.bubble([base[0], base[1], base[2] - 12], 0) : (mono ? this.bubble([0, 0, 62], 0) : this.bubble(base, shift));
    const h12 = String(d.getHours() % 12 || 12);
    const mm = String(d.getMinutes()).padStart(2, '0');
    const chars = (h12 + ':' + mm).split('');
    const tilts = [-4, 3, 0, -3, 4];
    const lifts = [6, -10, 0, 8, -6];
    let k = 0;
    const glyphs = chars.map((ch, i) => {
      if (ch === ':') return { colon: true, digit: false, fill: fillB };
      const g = { colon: false, digit: true, ch, fill: k % 2 === 0 ? fillA : fillB, tilt: tilts[i % 5], lift: lifts[i % 5] };
      k++;
      return g;
    });
    return {
      glyphs,
      time: h12 + ':' + mm,
      c2: night ? '#BE180E' : this.tone(base, shift, 8)
    };
  }
}
</script>
</body>
</html>
