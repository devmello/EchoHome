<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen timers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: linear-gradient(118deg, rgba(0,0,0,0) 22%, rgba(255,190,90,0.4) 34%, rgba(0,0,0,0) 46%), linear-gradient(118deg, rgba(0,0,0,0) 56%, rgba(255,90,70,0.38) 66%, rgba(0,0,0,0) 76%), radial-gradient(ellipse 55% 70% at 15% 15%, rgba(255,150,60,0.8) 0%, rgba(0,0,0,0) 70%), radial-gradient(ellipse 55% 65% at 90% 25%, rgba(255,70,90,0.6) 0%, rgba(0,0,0,0) 70%), radial-gradient(ellipse 70% 70% at 55% 105%, rgba(120,40,160,0.7) 0%, rgba(0,0,0,0) 72%), linear-gradient(180deg, #3A160E, #12070A);">

  <!-- Header -->
  <div style="position: absolute; left: 32px; top: 22px;">
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1;">Timers</div>
    <div style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.78); margin-top: 2px;">{{summary}}</div>
  </div>
  <button type="button" onClick="{{addTimer}}" style="position: absolute; right: 28px; top: 22px; height: 44px; padding: 0 18px 0 14px; border-radius: 22px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.26); backdrop-filter: blur(18px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1px 1px rgba(255,255,255,0.45), 0 8px 24px rgba(0,0,0,0.3); overflow: hidden;">
    <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(165deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 55%); pointer-events: none;"></span>
    <svg style="position: relative;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span style="position: relative;">5 min timer</span>
  </button>

  <!-- Live Activity-style glass platters -->
  <div style="position: absolute; left: 28px; right: 28px; top: 88px; display: flex; gap: 24px; justify-content: center;">
    <sc-for list="{{timers}}" as="tm" hint-placeholder-count="3">
      <div style="position: relative; width: 280px; height: 300px; flex-shrink: 0; border-radius: 34px; padding: 18px 20px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; background: {{tm.glass}}; border: 0.5px solid rgba(255,255,255,0.26); backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.48), inset 0 -1px 1px rgba(255,255,255,0.08), 0 18px 44px {{tm.shadow}}; overflow: hidden; transition: background 0.4s ease, box-shadow 0.4s ease;">
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 34px; background: linear-gradient(160deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.03) 36%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.06) 100%); pointer-events: none;"></span>
        <div style="position: relative; align-self: stretch; display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.015em;">{{tm.label}}</span>
          <span style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.72);">{{tm.totalLabel}}</span>
        </div>
        <div style="position: relative; width: 150px; height: 150px; margin-top: 12px;">
          <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
            <circle cx="75" cy="75" r="64" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="9"/>
            <circle cx="75" cy="75" r="64" fill="none" stroke="{{tm.ring}}" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{tm.dash}} 402.1" transform="rotate(-90 75 75)" style="transition: stroke-dasharray 1s linear;"/>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: {{tm.size}}px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">{{tm.left}}</div>
        </div>
        <div style="position: relative; display: flex; gap: 16px; margin-top: 14px;">
          <button type="button" aria-label="{{tm.mainLabel}}" onClick="{{tm.main}}" style="width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: {{tm.mainBg}}; color: {{tm.mainInk}};">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{tm.mainIcon}}"/></svg>
          </button>
          <button type="button" aria-label="Cancel {{tm.label}} timer" onClick="{{tm.cancel}}" style="width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.16); color: #fff;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 30px; font-weight: 700; color: rgba(255,255,255,0.86);">No timers running</div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.72);">Try “Hey Nova, add a 12-minute rice timer”</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() {
    const now = Date.now();
    this.setState({
      list: [
        { id: 1, label: 'Pasta', total: 600, endAt: now + 462000 },
        { id: 2, label: 'Oven', total: 1500, endAt: now + 1085000 },
        { id: 3, label: 'Tea', total: 240, endAt: now + 21000 }
      ],
      nextId: 4
    });
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  mmss(s) {
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0');
  }
  renderVals() {
    const st = this.state || {};
    const now = Date.now();
    const list = st.list || [];
    const flash = Math.floor(now / 500) % 2 === 0;
    const I = {
      pause: 'M7 4.5h3.4v15H7zM13.6 4.5H17v15h-3.6z',
      play: 'M8 5.3a1.3 1.3 0 0 1 2-1.1l10 6.7a1.3 1.3 0 0 1 0 2.2l-10 6.7a1.3 1.3 0 0 1-2-1.1z',
      repeat: 'M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z'
    };
    const update = (id, patch) => this.setState({ list: (this.state.list || []).map(x => (x.id === id ? Object.assign({}, x, patch) : x)) });
    let running = 0, done = 0;
    const timers = list.map(tm => {
      const left = tm.paused != null ? tm.paused : (tm.endAt - now) / 1000;
      const isDone = left <= 0;
      const isPaused = tm.paused != null && !isDone;
      if (isDone) done++; else if (!isPaused) running++;
      const frac = Math.max(0, Math.min(1, left / tm.total));
      return {
        label: tm.label,
        totalLabel: Math.round(tm.total / 60) + ' min',
        left: isDone ? 'Done' : this.mmss(left),
        size: isDone ? 40 : (left >= 3600 ? 32 : 40),
        dash: (402.1 * (isDone ? 1 : frac)).toFixed(1),
        ring: isDone ? '#30D158' : isPaused ? 'rgba(255,255,255,0.6)' : '#FF9F0A',
        glass: isDone ? (flash ? 'rgba(48,209,88,0.42)' : 'rgba(48,209,88,0.24)') : 'rgba(255,255,255,0.09)',
        shadow: isDone ? 'rgba(48,209,88,0.35)' : 'rgba(0,0,0,0.35)',
        mainIcon: isDone ? I.repeat : isPaused ? I.play : I.pause,
        mainLabel: (isDone ? 'Repeat ' : isPaused ? 'Resume ' : 'Pause ') + tm.label + ' timer',
        mainBg: isDone ? '#30D158' : '#FF9F0A',
        mainInk: isDone ? '#04210E' : '#2A1200',
        main: () => {
          if (isDone) update(tm.id, { endAt: Date.now() + tm.total * 1000, paused: null });
          else if (isPaused) update(tm.id, { endAt: Date.now() + tm.paused * 1000, paused: null });
          else update(tm.id, { paused: Math.max(0, (tm.endAt - Date.now()) / 1000) });
        },
        cancel: () => this.setState({ list: (this.state.list || []).filter(x => x.id !== tm.id) })
      };
    });
    const parts = [];
    if (running) parts.push(running + ' running');
    if (done) parts.push(done + ' done');
    if (list.length - running - done > 0) parts.push((list.length - running - done) + ' paused');
    return {
      timers,
      empty: list.length === 0,
      summary: parts.join(' · ') || 'Nothing running',
      addTimer: () => {
        const l = this.state.list || [];
        if (l.length >= 3) return;
        const id = this.state.nextId || 4;
        this.setState({ list: l.concat([{ id, label: 'Timer', total: 300, endAt: Date.now() + 300000 }]), nextId: id + 1 });
      }
    };
  }
}
</script>
</body>
</html>
