<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Volume, brightness, mic and camera indicators</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; inset: 0;">
    <dc-import name="Solar" color="#FF9F0A" live="{{ true }}" hint-size="960px,480px"></dc-import>
  </div>

  <!-- Tap anywhere to fire the next indicator -->
  <button type="button" aria-label="Show next indicator" onClick="{{next}}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; cursor: pointer;"></button>

  <!-- Persistent privacy indicators, top-right, while mic or camera is off -->
  <div style="position: absolute; right: 22px; top: 18px; display: flex; gap: 8px; pointer-events: none;">
    <sc-if value="{{micOffBadge}}" hint-placeholder-val="{{ false }}">
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #FF453A; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(0,0,0,0.5);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Microphone off" role="img"><path d="M3 3l18 18M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.9-.8M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 11.2 5.6M12 18v3"/></svg>
      </div>
    </sc-if>
    <sc-if value="{{camOffBadge}}" hint-placeholder-val="{{ false }}">
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #FF453A; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(0,0,0,0.5);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Camera off" role="img"><path d="M3 3l18 18M7.5 6H4.5A1.5 1.5 0 0 0 3 7.5v10A1.5 1.5 0 0 0 4.5 19h13M10 4h5l1.5 2h3A1.5 1.5 0 0 1 21 7.5V16M10 10.5a3 3 0 0 0 4 4"/></svg>
      </div>
    </sc-if>
  </div>

  <!-- The indicator: a glass capsule that drops out of the top edge, where the Echo's buttons are -->
  <div role="status" aria-live="polite" style="position: absolute; left: 50%; top: 0; width: {{pillW}}px; margin-left: {{pillOffset}}px; height: 64px; border-radius: 32px; display: flex; align-items: center; gap: 14px; padding: 0 22px 0 18px; box-sizing: border-box; pointer-events: none; background: {{pillBg}}; border: 0.5px solid rgba(255,255,255,0.3); backdrop-filter: blur(18px) saturate(1.9) brightness(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.9) brightness(1.15); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.5), inset 0 -1px 1px rgba(255,255,255,0.1), 0 14px 40px rgba(0,0,0,0.5); overflow: hidden; transform: translateY({{pillY}}px) scale({{pillScale}}); opacity: {{pillOpacity}}; transition: transform 0.55s cubic-bezier(0.3, 1.45, 0.5, 1), opacity 0.25s ease, width 0.4s cubic-bezier(0.3, 1.3, 0.5, 1), margin-left 0.4s cubic-bezier(0.3, 1.3, 0.5, 1), background 0.3s ease;">
    <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 32px; background: linear-gradient(170deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0) 70%); pointer-events: none;"></span>
    <svg style="position: relative; flex-shrink: 0;" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"/></svg>
    <sc-if value="{{isLevel}}" hint-placeholder-val="{{ true }}">
      <span style="position: relative; flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.22); overflow: hidden;">
        <span style="display: block; height: 10px; border-radius: 5px; background: #fff; width: {{level}}%; transition: width 0.35s cubic-bezier(0.3, 1.3, 0.5, 1);"></span>
      </span>
      <span style="position: relative; width: 40px; text-align: right; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">{{level}}</span>
    </sc-if>
    <sc-if value="{{isMessage}}" hint-placeholder-val="{{ false }}">
      <span style="position: relative; display: flex; flex-direction: column; line-height: 1.15;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em;">{{title}}</span>
        <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8);">{{sub}}</span>
      </span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"show":{"editor":"enum","default":"Cycle","options":["Cycle","Volume","Brightness","Mic off","Camera off","Mic on"]},"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.t0 = Date.now(); this.timer = setInterval(() => this.setState({ t: Date.now() }), 100); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const st = this.state || {};
    const now = Date.now();
    const t0 = this.t0 || now;
    const kinds = ['Volume', 'Brightness', 'Mic off', 'Camera off', 'Mic on'];
    const mode = this.props.show ?? 'Cycle';
    const period = 2600;
    const el = now - t0 + (st.skip || 0) * period;
    const idx = Math.floor(el / period);
    const phase = el % period;
    const kind = mode === 'Cycle' ? kinds[idx % kinds.length] : mode;
    const visible = mode === 'Cycle' ? phase < 1900 : true;
    const ramp = Math.min(1, phase / 900);
    const I = {
      vol: 'M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13',
      sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      micOff: 'M3 3l18 18M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.9-.8M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 11.2 5.6M12 18v3',
      mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v3',
      camOff: 'M3 3l18 18M7.5 6H4.5A1.5 1.5 0 0 0 3 7.5v10A1.5 1.5 0 0 0 4.5 19h13M10 4h5l1.5 2h3A1.5 1.5 0 0 1 21 7.5V16M10 10.5a3 3 0 0 0 4 4'
    };
    const spec = {
      'Volume': { icon: I.vol, level: Math.round(30 + 30 * ramp), w: 360, bg: 'rgba(255,255,255,0.12)' },
      'Brightness': { icon: I.sun, level: Math.round(80 - 35 * ramp), w: 360, bg: 'rgba(255,255,255,0.12)' },
      'Mic off': { icon: I.micOff, title: 'Microphone off', sub: 'Nova can’t hear you', w: 300, bg: 'rgba(255,69,58,0.55)' },
      'Camera off': { icon: I.camOff, title: 'Camera off', sub: 'Shutter closed', w: 260, bg: 'rgba(255,69,58,0.55)' },
      'Mic on': { icon: I.mic, title: 'Microphone on', sub: 'Listening for “Hey Nova”', w: 330, bg: 'rgba(48,209,88,0.5)' }
    }[kind];
    const cyclePos = idx % kinds.length;
    const micOff = mode === 'Cycle' ? (cyclePos === 2 || cyclePos === 3) : mode === 'Mic off';
    const camOff = mode === 'Cycle' ? cyclePos === 3 : mode === 'Camera off';
    return {
      icon: spec.icon,
      isLevel: spec.level != null,
      isMessage: spec.level == null,
      level: spec.level ?? 0,
      title: spec.title || '',
      sub: spec.sub || '',
      pillW: spec.w,
      pillOffset: -spec.w / 2,
      pillBg: spec.bg,
      pillY: visible ? 16 : -90,
      pillScale: visible ? 1 : 0.7,
      pillOpacity: visible ? 1 : 0,
      micOffBadge: micOff && !(visible && kind === 'Mic off'),
      camOffBadge: camOff && !(visible && kind === 'Camera off'),
      next: () => this.setState({ skip: (st.skip || 0) + 1 })
    };
  }
}
</script>
</body>
</html>
