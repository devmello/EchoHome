<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commute glance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #05070C; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- Map (content): dark streets, coastline, the route -->
  <svg aria-hidden="true" style="position: absolute; left: 400px; top: 0;" width="560" height="480" viewBox="0 0 560 480">
    <defs>
      <linearGradient id="route" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#64D2FF"/><stop offset="1" stop-color="#0A84FF"/></linearGradient>
      <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#05070C"/><stop offset="0.35" stop-color="#05070C" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M0 420 C 120 400, 200 440, 300 430 S 470 400, 560 410 L 560 480 L 0 480 Z" fill="#0B1A2C"/>
    <g stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none">
      <path d="M40 0 L 90 480"/><path d="M140 0 L 170 480"/><path d="M240 0 L 250 480"/><path d="M330 0 L 320 480"/><path d="M430 0 L 400 480"/><path d="M520 0 L 480 480"/>
      <path d="M0 60 L 560 40"/><path d="M0 140 L 560 125"/><path d="M0 220 L 560 210"/><path d="M0 300 L 560 295"/><path d="M0 370 L 560 372"/>
    </g>
    <path d="M60 400 C 140 330, 170 250, 250 210 S 400 120, 470 70" stroke="rgba(255,255,255,0.18)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M110 380 C 180 340, 230 300, 300 290 S 420 220, 470 70" stroke="rgba(255,255,255,0.16)" stroke-width="6" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
    <path d="M60 400 C 140 330, 170 250, 250 210 S 400 120, 470 70" stroke="url(#route)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M196 262 C 215 240, 228 228, 250 210" stroke="#FF9F0A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="400" r="11" fill="#fff"/><circle cx="60" cy="400" r="6" fill="#0A84FF"/>
    <circle cx="470" cy="70" r="13" fill="#FF453A"/><circle cx="470" cy="70" r="5" fill="#fff"/>
    <rect x="0" y="0" width="560" height="480" fill="url(#fadeL)"/>
  </svg>

  <div style="position: absolute; left: 48px; top: 40px; width: 420px;">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; color: rgba(255,255,255,0.6);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6 17l1.5-6h9L18 17M8 21v-2M16 21v-2M7.5 11 9 6h6l1.5 5"/></svg>
      <span>TO WORK</span>
    </div>
    <div style="font-size: 64px; font-weight: 800; line-height: 1.02; letter-spacing: -0.035em; margin-top: 10px;">Leave in<br>{{leaveIn}} min</div>
    <div style="font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.8); margin-top: 12px;">{{driveMin}} min via Hwy 17 · arrive {{arrive}}</div>
    <div style="display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;">
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #FFB340; background: rgba(255,159,10,0.16);">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #FF9F0A;"></span>Slow near Scotts Valley · +6 min
      </span>
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #9FDcFF; background: rgba(100,210,255,0.14);">Rain from 8 AM</span>
    </div>
  </div>

  <!-- Alternatives (content cards) -->
  <div style="position: absolute; left: 48px; bottom: 32px; display: flex; gap: 12px;">
    <div style="width: 196px; height: 86px; border-radius: 22px; padding: 14px 16px; box-sizing: border-box; background: rgba(255,255,255,0.08);">
      <div style="font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.6);">VIA SOQUEL DR</div>
      <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px;">{{altMin}} min</div>
    </div>
    <div style="width: 196px; height: 86px; border-radius: 22px; padding: 14px 16px; box-sizing: border-box; background: rgba(255,255,255,0.08);">
      <div style="font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.6);">BUS 35 · 8:20 AM</div>
      <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px;">41 min</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: Date.now() }), 15000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const d = new Date();
    const drive = 24;
    const leaveIn = 18;
    const arr = new Date(d.getTime() + (leaveIn + drive) * 60000);
    return {
      leaveIn,
      driveMin: drive,
      altMin: drive + 7,
      arrive: (arr.getHours() % 12 || 12) + ':' + String(arr.getMinutes()).padStart(2, '0') + (arr.getHours() < 12 ? ' AM' : ' PM')
    };
  }
}
</script>
</body>
</html>
