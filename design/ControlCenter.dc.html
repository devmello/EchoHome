<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control Center</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- The face underneath; softened while Control Center is down -->
  <div style="position: absolute; inset: 0; filter: blur({{bgBlur}}px) saturate(1.3); opacity: {{bgOpacity}}; transform: scale({{bgScale}}); transition: filter 0.45s ease, opacity 0.45s ease, transform 0.45s ease;">
    <dc-import name="Digital" color="#64D2FF" live="{{ true }}" complications="{{ true }}" hint-size="960px,480px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 30% 20%, rgba(10,132,255,0.35), rgba(0,0,0,0) 70%), radial-gradient(ellipse 60% 60% at 85% 90%, rgba(191,90,242,0.28), rgba(0,0,0,0) 70%); opacity: {{tintOpacity}}; transition: opacity 0.45s ease;"></div>

  <!-- Pull handle when closed -->
  <sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="Open Control Center" onClick="{{toggle}}" style="position: absolute; left: 380px; top: 0; width: 200px; height: 44px; border: 0; background: none; cursor: pointer; display: flex; justify-content: center; padding-top: 10px; box-sizing: border-box;">
      <span style="display: block; width: 56px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.55);"></span>
    </button>
  </sc-if>

  <!-- The panel slides down from the top edge -->
  <div style="position: absolute; inset: 0; transform: translateY({{panelY}}px); opacity: {{panelOpacity}}; transition: transform 0.5s cubic-bezier(0.3, 1.15, 0.5, 1), opacity 0.3s ease;">

    <!-- Header -->
    <div style="position: absolute; left: 28px; top: 16px; display: flex; align-items: baseline; gap: 12px;">
      <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">{{clock}}</span>
      <span style="font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.75);">{{dateLine}}</span>
    </div>
    <div style="position: absolute; right: 24px; top: 14px; display: flex; gap: 10px;">
      <sc-if value="{{micMuted}}" hint-placeholder-val="{{ false }}">
        <div style="height: 44px; padding: 0 14px; border-radius: 22px; display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; background: rgba(255,69,58,0.5); border: 0.5px solid rgba(255,255,255,0.28); backdrop-filter: blur(16px) saturate(1.8); -webkit-backdrop-filter: blur(16px) saturate(1.8); box-shadow: inset 0 1px 1px rgba(255,255,255,0.45);">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #fff;"></span>Mic off
        </div>
      </sc-if>
      <button type="button" aria-label="Settings" style="position: relative; width: 44px; height: 44px; border-radius: 22px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.24); backdrop-filter: blur(16px) saturate(1.8) brightness(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.8) brightness(1.15); box-shadow: inset 0 1px 1px rgba(255,255,255,0.45), 0 8px 24px rgba(0,0,0,0.35);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>

    <!-- Connectivity -->
    <div style="position: absolute; left: 24px; top: 76px; width: 300px; height: 180px; border-radius: 32px; padding: 14px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,0.09); border: 0.5px solid rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.08), 0 14px 36px rgba(0,0,0,0.4); overflow: hidden;">
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 32px; background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.03) 38%, rgba(255,255,255,0) 62%); pointer-events: none;"></span>
      <sc-for list="{{radios}}" as="rd" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{rd.pressed}}" aria-label="{{rd.name}}" onClick="{{rd.flip}}" style="position: relative; border: 0; background: none; cursor: pointer; font-family: inherit; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0;">
          <span style="width: 52px; height: 52px; border-radius: 50%; background: {{rd.bg}}; display: flex; align-items: center; justify-content: center; transition: background 0.25s ease;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{rd.icon}}"/></svg>
          </span>
          <span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); white-space: nowrap;">{{rd.label}}</span>
        </button>
      </sc-for>
    </div>

    <!-- Media -->
    <div style="position: absolute; left: 24px; top: 272px; width: 300px; height: 184px; border-radius: 32px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,0.09); border: 0.5px solid rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.08), 0 14px 36px rgba(0,0,0,0.4); overflow: hidden;">
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 32px; background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.03) 38%, rgba(255,255,255,0) 62%); pointer-events: none;"></span>
      <div style="position: relative; display: flex; gap: 12px; align-items: center;">
        <div style="width: 60px; height: 60px; border-radius: 12px; flex-shrink: 0; position: relative; overflow: hidden; background: linear-gradient(180deg, #17485A 0%, #B9654E 44%, #F7B98A 58%);">
          <div style="position: absolute; left: 18px; top: 17px; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(180deg, #FFE7BC, #FF6A3D);"></div>
          <div style="position: absolute; left: 0; right: 0; top: 35px; bottom: 0; background: linear-gradient(180deg, #0F3E48, #06191E);"></div>
        </div>
        <div style="min-width: 0;">
          <div style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Low Tide Radio</div>
          <div style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7);">Marisol Vey · AirPlay</div>
        </div>
      </div>
      <div style="position: relative; display: flex; justify-content: space-around; align-items: center;">
        <button type="button" aria-label="Previous" style="width: 48px; height: 48px; border: 0; background: none; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 9.2a1.4 1.4 0 0 0-2.1-1.2l-9.5 6.8a1.5 1.5 0 0 0 0 2.4l9.5 6.8a1.4 1.4 0 0 0 2.1-1.2z"/><path d="M29 9.2a1.4 1.4 0 0 0-2.1-1.2l-9.5 6.8a1.5 1.5 0 0 0 0 2.4l9.5 6.8a1.4 1.4 0 0 0 2.1-1.2z"/></svg></button>
        <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 56px; height: 56px; border: 0; background: none; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;">
          <svg width="34" height="34" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="{{playIcon}}"/></svg>
        </button>
        <button type="button" aria-label="Next" style="width: 48px; height: 48px; border: 0; background: none; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M3 9.2a1.4 1.4 0 0 1 2.1-1.2l9.5 6.8a1.5 1.5 0 0 1 0 2.4l-9.5 6.8A1.4 1.4 0 0 1 3 22.8z"/><path d="M16 9.2a1.4 1.4 0 0 1 2.1-1.2l9.5 6.8a1.5 1.5 0 0 1 0 2.4l-9.5 6.8a1.4 1.4 0 0 1-2.1-1.2z"/></svg></button>
      </div>
    </div>

    <!-- Brightness + volume: tall glass sliders; the fill is plain white, as in iOS -->
    <sc-for list="{{sliders}}" as="sl" hint-placeholder-count="2">
      <button type="button" aria-label="{{sl.name}} {{sl.pct}} percent" onClick="{{sl.set}}" style="position: absolute; left: {{sl.x}}px; top: 76px; width: 92px; height: 380px; border-radius: 46px; padding: 0; cursor: pointer; background: rgba(255,255,255,0.09); border: 0.5px solid rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.08), 0 14px 36px rgba(0,0,0,0.4); overflow: hidden;">
        <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{sl.pct}}%; background: rgba(255,255,255,0.94); transition: height 0.3s cubic-bezier(0.3, 1.2, 0.5, 1);"></span>
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 46px; background: linear-gradient(170deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 40%); pointer-events: none;"></span>
        <span style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; color: {{sl.iconInk}};">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sl.icon}}"/></svg>
        </span>
      </button>
    </sc-for>

    <!-- Wide toggles: Do Not Disturb, Night mode -->
    <sc-for list="{{wides}}" as="w" hint-placeholder-count="2">
      <button type="button" aria-pressed="{{w.pressed}}" onClick="{{w.flip}}" style="position: absolute; left: {{w.x}}px; top: 76px; width: 182px; height: 110px; border-radius: 30px; padding: 0 16px; box-sizing: border-box; cursor: pointer; font-family: inherit; text-align: left; color: #fff; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.09); border: 0.5px solid rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.08), 0 14px 36px rgba(0,0,0,0.4); overflow: hidden;">
        <span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: {{w.bg}}; display: flex; align-items: center; justify-content: center; transition: background 0.25s ease;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{w.icon}}"/></svg>
        </span>
        <span style="min-width: 0;">
          <span style="display: block; font-size: 15px; font-weight: 700; line-height: 1.15;">{{w.name}}</span>
          <span style="display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.72); margin-top: 2px;">{{w.state}}</span>
        </span>
      </button>
    </sc-for>

    <!-- Square toggles: mic, camera, timer -->
    <sc-for list="{{squares}}" as="q" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{q.pressed}}" onClick="{{q.flip}}" style="position: absolute; left: {{q.x}}px; top: 202px; width: 116px; height: 116px; border-radius: 30px; padding: 14px; box-sizing: border-box; cursor: pointer; font-family: inherit; text-align: left; color: #fff; display: flex; flex-direction: column; justify-content: space-between; background: {{q.tile}}; border: 0.5px solid rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.08), 0 14px 36px rgba(0,0,0,0.4); overflow: hidden; transition: background 0.25s ease;">
        <span style="width: 42px; height: 42px; border-radius: 50%; background: {{q.bg}}; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"/></svg>
        </span>
        <span>
          <span style="display: block; font-size: 14px; font-weight: 700;">{{q.name}}</span>
          <span style="display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.72);">{{q.state}}</span>
        </span>
      </button>
    </sc-for>

    <!-- Who's using it: manual switch + auto by camera -->
    <div style="position: absolute; left: 556px; top: 334px; width: 380px; height: 122px; border-radius: 30px; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,0.09); border: 0.5px solid rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); -webkit-backdrop-filter: blur(20px) saturate(1.8) brightness(1.1); box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.08), 0 14px 36px rgba(0,0,0,0.4); overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 14px; font-weight: 700;">Showing {{profileName}}</span>
        <button type="button" aria-pressed="{{autoPressed}}" onClick="{{toggleAuto}}" style="height: 30px; padding: 0 12px; border-radius: 15px; border: 0; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; color: {{autoInk}}; background: {{autoBg}}; display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2"/><circle cx="12" cy="11" r="3"/></svg>
          Auto by face
        </button>
      </div>
      <div style="display: flex; gap: 12px;">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{p.pressed}}" aria-label="Switch to {{p.name}}" onClick="{{p.pick}}" style="width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; font-family: inherit; font-size: 18px; font-weight: 800; color: #fff; background: {{p.color}}; box-shadow: {{p.ring}};">{{p.initial}}</button>
        </sc-for>
      </div>
    </div>

    <!-- Grabber -->
    <button type="button" aria-label="Close Control Center" onClick="{{toggle}}" style="position: absolute; left: 430px; bottom: 0; width: 100px; height: 22px; border: 0; background: none; cursor: pointer; display: flex; justify-content: center; align-items: flex-start; padding-top: 4px; box-sizing: border-box;">
      <span style="display: block; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.6);"></span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const st = this.state || {};
    const open = st.open ?? true;
    const g = (k, d) => (st[k] ?? d);
    const d = new Date();
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const ratioY = (e) => { const r = e.currentTarget.getBoundingClientRect(); return Math.max(0, Math.min(1, (r.bottom - e.clientY) / r.height)); };
    const I = {
      wifi: 'M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01',
      bt: 'M7 7l10 10-5 4V3l5 4L7 17',
      airplay: 'M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1M12 15l5 6H7z',
      spotify: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM7.5 9.5c3-1 6.5-.7 9 .8M8 12.8c2.5-.7 5.2-.4 7.4.8M8.6 15.8c2-.5 4-.3 5.8.6',
      sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      vol: 'M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13',
      moon: 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z',
      night: 'M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9zM17 3v4M15 5h4',
      mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v3',
      micOff: 'M3 3l18 18M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.9-.8M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 11.2 5.6M12 18v3',
      cam: 'M3 7.5A1.5 1.5 0 0 1 4.5 6h3L9 4h6l1.5 2h3A1.5 1.5 0 0 1 21 7.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zM12 10a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
      camOff: 'M3 3l18 18M7.5 6H4.5A1.5 1.5 0 0 0 3 7.5v10A1.5 1.5 0 0 0 4.5 19h13M10 4h5l1.5 2h3A1.5 1.5 0 0 1 21 7.5V16M10 10.5a3 3 0 0 0 4 4',
      timer: 'M12 8v5l3 2M9 2h6M12 4a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'
    };
    const radio = (key, name, label, icon, def, color) => {
      const on = g(key, def);
      return { name, label, icon, pressed: on ? 'true' : 'false', bg: on ? color : 'rgba(255,255,255,0.2)', flip: () => this.setState({ [key]: !on }) };
    };
    const dnd = g('dnd', true), nightAuto = g('night', true), mic = g('micMuted', false), camOff = g('camOff', false);
    const bright = g('bright', 0.7), vol = g('vol', 0.45);
    const playing = g('playing', true);
    const profile = g('profile', 0);
    const auto = g('auto', true);
    const people = [
      { name: 'You', initial: 'Y', color: '#0A84FF' },
      { name: 'Maya', initial: 'M', color: '#FF375F' },
      { name: 'Guest', initial: 'G', color: '#8E8E93' }
    ];
    return {
      clock: (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0'),
      dateLine: days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate(),
      closed: !open,
      toggle: () => this.setState({ open: !open }),
      panelY: open ? 0 : -480,
      panelOpacity: open ? 1 : 0,
      bgBlur: open ? 24 : 0,
      bgOpacity: open ? 0.55 : 1,
      bgScale: open ? 1.04 : 1,
      tintOpacity: open ? 1 : 0,
      micMuted: mic,
      radios: [
        radio('wifi', 'Wi-Fi', 'Home-5G', I.wifi, true, '#0A84FF'),
        radio('bt', 'Bluetooth', 'Bluetooth', I.bt, true, '#0A84FF'),
        radio('airplay', 'AirPlay receiver', 'AirPlay', I.airplay, true, '#30D158'),
        radio('spotify', 'Spotify Connect', 'Spotify', I.spotify, false, '#30D158')
      ],
      playLabel: playing ? 'Pause' : 'Play',
      playIcon: playing ? 'M7 5h6.4v22H7zM18.6 5H25v22h-6.4z' : 'M8 6.3a1.6 1.6 0 0 1 2.4-1.4l16 9.7a1.6 1.6 0 0 1 0 2.8l-16 9.7A1.6 1.6 0 0 1 8 25.7z',
      togglePlay: () => this.setState({ playing: !playing }),
      sliders: [
        { name: 'Brightness', x: 340, pct: Math.round(bright * 100), icon: I.sun, iconInk: bright > 0.15 ? '#1C1C1E' : '#FFFFFF', set: (e) => this.setState({ bright: ratioY(e) }) },
        { name: 'Volume', x: 448, pct: Math.round(vol * 100), icon: I.vol, iconInk: vol > 0.15 ? '#1C1C1E' : '#FFFFFF', set: (e) => this.setState({ vol: ratioY(e) }) }
      ],
      wides: [
        { x: 556, name: 'Do Not Disturb', state: dnd ? 'On until 7:00 AM' : 'Off', icon: I.moon, pressed: dnd ? 'true' : 'false', bg: dnd ? '#5E5CE6' : 'rgba(255,255,255,0.2)', flip: () => this.setState({ dnd: !dnd }) },
        { x: 754, name: 'Night mode', state: nightAuto ? 'Auto · in the dark' : 'Off', icon: I.night, pressed: nightAuto ? 'true' : 'false', bg: nightAuto ? '#BE180E' : 'rgba(255,255,255,0.2)', flip: () => this.setState({ night: !nightAuto }) }
      ],
      squares: [
        { x: 556, name: 'Microphone', state: mic ? 'Off' : 'On', icon: mic ? I.micOff : I.mic, pressed: mic ? 'true' : 'false', bg: mic ? '#FF453A' : 'rgba(255,255,255,0.2)', tile: mic ? 'rgba(255,69,58,0.28)' : 'rgba(255,255,255,0.09)', flip: () => this.setState({ micMuted: !mic }) },
        { x: 688, name: 'Camera', state: camOff ? 'Off' : 'On', icon: camOff ? I.camOff : I.cam, pressed: camOff ? 'true' : 'false', bg: camOff ? '#FF453A' : 'rgba(255,255,255,0.2)', tile: camOff ? 'rgba(255,69,58,0.28)' : 'rgba(255,255,255,0.09)', flip: () => this.setState({ camOff: !camOff }) },
        { x: 820, name: 'Timer', state: 'Pasta · 7:42', icon: I.timer, pressed: 'false', bg: '#FF9F0A', tile: 'rgba(255,255,255,0.09)', flip: () => null }
      ],
      profileName: profile === 0 ? 'your stuff' : people[profile].name + '’s stuff',
      people: people.map((p, i) => ({ ...p, pressed: i === profile ? 'true' : 'false', ring: i === profile ? '0 0 0 3px rgba(0,0,0,0.6), 0 0 0 5px #FFFFFF' : 'none', pick: () => this.setState({ profile: i }) })),
      autoPressed: auto ? 'true' : 'false',
      autoBg: auto ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.14)',
      autoInk: auto ? '#111114' : '#FFFFFF',
      toggleAuto: () => this.setState({ auto: !auto })
    };
  }
}
</script>
</body>
</html>
