<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandBy Analog clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="Analog clock showing {{spoken}}" style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- Rectangular dial: minute track follows the screen's rounded rectangle -->
  <sc-for list="{{ticks}}" as="tk" hint-placeholder-count="60">
    <div style="position: absolute; left: {{tk.left}}px; top: {{tk.top}}px; width: {{tk.w}}px; height: {{tk.h}}px; border-radius: 3px; background: {{tk.color}}; transform: rotate({{tk.rot}}deg);"></div>
  </sc-for>

  <!-- Hour numerals -->
  <sc-for list="{{numerals}}" as="nu" hint-placeholder-count="12">
    <div style="position: absolute; left: {{nu.left}}px; top: {{nu.top}}px; width: 88px; height: 56px; line-height: 56px; text-align: center; font-size: 46px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: {{fg}};">{{nu.label}}</div>
  </sc-for>

  <!-- Complications (iOS 27.3 style): date at 9, alarm at 3 -->
  <sc-if value="{{showComplications}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 150px; top: 214px; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: {{accent}};">{{dayShort}}</div>
      <div style="font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: {{fg}};">{{dayNum}}</div>
    </div>
    <div style="position: absolute; left: 690px; top: 214px; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{fg}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>
      </svg>
      <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">7:00</div>
    </div>
  </sc-if>

  <!-- Hour hand -->
  <div style="position: absolute; left: 473px; top: 132px; width: 14px; height: 108px; transform-origin: 50% 100%; transform: rotate({{hourDeg}}deg);">
    <div style="position: absolute; left: 1px; right: 1px; top: 0; bottom: 24px; border-radius: 6px; background: {{fg}}; box-shadow: 0 0 12px rgba(0,0,0,0.6);"></div>
    <div style="position: absolute; left: 5px; width: 4px; bottom: 0; height: 30px; background: {{fg}};"></div>
  </div>

  <!-- Minute hand -->
  <div style="position: absolute; left: 473px; top: 88px; width: 14px; height: 152px; transform-origin: 50% 100%; transform: rotate({{minDeg}}deg);">
    <div style="position: absolute; left: 1px; right: 1px; top: 0; bottom: 24px; border-radius: 6px; background: {{fg}}; box-shadow: 0 0 12px rgba(0,0,0,0.6);"></div>
    <div style="position: absolute; left: 5px; width: 4px; bottom: 0; height: 30px; background: {{fg}};"></div>
  </div>
  <div style="position: absolute; left: 473px; top: 233px; width: 14px; height: 14px; border-radius: 50%; background: {{fg}};"></div>

  <!-- Second hand, in the accent color -->
  <div style="position: absolute; left: 478.5px; top: 46px; width: 3px; height: 228px; transform-origin: 50% 194px; transform: rotate({{secDeg}}deg); background: {{accent}}; border-radius: 2px;"></div>
  <div style="position: absolute; left: 475px; top: 235px; width: 10px; height: 10px; border-radius: 50%; background: {{accent}};"></div>
  <div style="position: absolute; left: 478.5px; top: 238.5px; width: 3px; height: 3px; border-radius: 50%; background: #000;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"color":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#FF453A","#FFD60A","#30D158","#64D2FF","#0A84FF","#BF5AF2","#FFFFFF"]},"complications":{"editor":"boolean","default":true},"night":{"editor":"boolean","default":false},"live":{"editor":"boolean","default":true},"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  ring(deg, a, b) {
    const n = 5, th = deg * Math.PI / 180;
    const dx = Math.sin(th), dy = -Math.cos(th);
    const t = Math.pow(Math.pow(Math.abs(dx / a), n) + Math.pow(Math.abs(dy / b), n), -1 / n);
    const x = dx * t, y = dy * t;
    const gx = Math.sign(x) * Math.pow(Math.abs(x / a), n - 1) / a;
    const gy = Math.sign(y) * Math.pow(Math.abs(y / b), n - 1) / b;
    const g = Math.hypot(gx, gy) || 1;
    return { x: 480 + x, y: 240 + y, nx: gx / g, ny: gy / g, rot: Math.atan2(gx, -gy) * 180 / Math.PI };
  }
  geometry(night, accent) {
    const key = night + accent;
    if (this._geoKey === key) return this._geo;
    const ticks = [];
    for (let i = 0; i < 60; i++) {
      const hour = i % 5 === 0;
      const len = hour ? 22 : 11, w = hour ? 5 : 2.5;
      const p = this.ring(i * 6, 446, 222);
      const cx = p.x - p.nx * len / 2, cy = p.y - p.ny * len / 2;
      ticks.push({
        left: (cx - w / 2).toFixed(2), top: (cy - len / 2).toFixed(2), w: w, h: len, rot: p.rot.toFixed(2),
        color: night ? (hour ? '#BE180E' : 'rgba(190,24,14,0.55)') : (hour ? '#FFFFFF' : 'rgba(255,255,255,0.38)')
      });
    }
    const numerals = [];
    for (let h = 1; h <= 12; h++) {
      const p = this.ring(h * 30, 380, 172);
      numerals.push({ label: String(h), left: (p.x - 44).toFixed(1), top: (p.y - 28).toFixed(1) });
    }
    this._geoKey = key;
    this._geo = { ticks, numerals };
    return this._geo;
  }
  renderVals() {
    const live = this.props.live ?? true;
    const d = new Date();
    if (!live) d.setHours(10, 9, 30, 0);
    const night = this.props.night ?? false;
    const accent = night ? '#BE180E' : (this.props.color ?? '#FF9F0A');
    const fg = night ? '#BE180E' : '#FFFFFF';
    const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    const g = this.geometry(night, accent);
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    return {
      ticks: g.ticks,
      numerals: g.numerals,
      hourDeg: ((h % 12) * 30 + m * 0.5).toFixed(2),
      minDeg: (m * 6 + s * 0.1).toFixed(2),
      secDeg: s * 6,
      accent: accent,
      fg: fg,
      dayShort: days[d.getDay()],
      dayNum: String(d.getDate()),
      spoken: (h % 12 || 12) + ':' + String(m).padStart(2, '0'),
      showComplications: this.props.complications ?? true
    };
  }
}
</script>
</body>
</html>
