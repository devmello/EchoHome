<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo Island, live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- The screen underneath -->
  <div style="position: absolute; inset: 0;">
    <sc-if value="{{bg.analog}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Analog" color="#FF9F0A" live="{{ true }}" complications="{{ false }}" hint-size="960px,480px"></dc-import>
    </sc-if>
    <sc-if value="{{bg.glass}}" hint-placeholder-val="{{ true }}">
      <dc-import name="Glass" live="{{ true }}" glass="{{ 0.45 }}" wallpaper="Dusk" hint-size="960px,480px"></dc-import>
    </sc-if>
    <sc-if value="{{bg.photos}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Photos" seconds="{{ 12 }}" hint-size="960px,480px"></dc-import>
    </sc-if>
  </div>

  <!-- Tap outside an expanded island to shrink it back -->
  <sc-if value="{{isExpanded}}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="Collapse island" onClick="{{collapse}}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: rgba(0,0,0,0.25); cursor: pointer;"></button>
  </sc-if>

  <!-- ===== The island ===== -->
  <div style="position: absolute; left: 50%; top: 12px; width: {{w}}px; height: {{h}}px; margin-left: {{ml}}px; border-radius: {{r}}px; background: {{skin.bg}}; border: {{skin.border}}; backdrop-filter: {{skin.blur}}; -webkit-backdrop-filter: {{skin.blur}}; box-shadow: {{skin.shadow}}; overflow: hidden; opacity: {{islandOpacity}}; transition: width 0.6s cubic-bezier(0.3, 1.32, 0.5, 1), height 0.6s cubic-bezier(0.3, 1.32, 0.5, 1), margin-left 0.6s cubic-bezier(0.3, 1.32, 0.5, 1), border-radius 0.6s cubic-bezier(0.3, 1.32, 0.5, 1), opacity 0.3s ease;">
    <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{skin.specular}}; pointer-events: none;"></span>

    <!-- COMPACT contents -->
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 9px; box-sizing: border-box; opacity: {{compactOpacity}}; transition: opacity 0.2s ease;">
      <sc-if value="{{c.timer}}" hint-placeholder-val="{{ true }}">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="10.5" fill="none" stroke="rgba(255,159,10,0.3)" stroke-width="3.5"/><circle cx="14" cy="14" r="10.5" fill="none" stroke="#FF9F0A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="{{timerDash}} 66" transform="rotate(-90 14 14)"/></svg>
        <span style="font-size: 19px; font-weight: 700; color: #FF9F0A; font-variant-numeric: tabular-nums;">{{timerLeft}}</span>
      </sc-if>
      <sc-if value="{{c.music}}" hint-placeholder-val="{{ false }}">
        <span style="width: 28px; height: 28px; border-radius: 8px; position: relative; overflow: hidden; background: linear-gradient(180deg, #17485A 0%, #B9654E 44%, #F7B98A 58%);"><span style="position: absolute; left: 0; right: 0; top: 16px; bottom: 0; background: #0F3E48;"></span><span style="position: absolute; left: 8px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: #FFB36B;"></span></span>
        <span style="display: flex; align-items: center; gap: 3px; height: 24px;">
          <sc-for list="{{eq}}" as="b" hint-placeholder-count="5"><span style="width: 3.5px; height: {{b}}px; border-radius: 2px; background: #F4B98A; transition: height 0.1s linear;"></span></sc-for>
        </span>
      </sc-if>
      <sc-if value="{{c.assistant}}" hint-placeholder-val="{{ false }}">
        <span style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; position: relative; box-shadow: inset 0 1px 1px rgba(255,255,255,0.6);"><span style="position: absolute; left: -6px; top: -6px; width: 38px; height: 38px; background: conic-gradient(from {{spin}}deg, #64D2FF, #BF5AF2, #FF375F, #FF9F0A, #64D2FF); filter: blur(4px);"></span></span>
        <span style="display: flex; align-items: center; gap: 3px; height: 24px;">
          <sc-for list="{{eqA}}" as="b" hint-placeholder-count="6"><span style="width: 3.5px; height: {{b.h}}px; border-radius: 2px; background: {{b.c}}; transition: height 0.1s linear;"></span></sc-for>
        </span>
      </sc-if>
    </div>

    <!-- EXPANDED: Now Playing -->
    <sc-if value="{{e.music}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; padding: 22px 26px; box-sizing: border-box; display: flex; align-items: center; gap: 18px; opacity: {{expandedOpacity}}; transition: opacity 0.25s ease 0.15s;">
        <span style="width: 116px; height: 116px; flex-shrink: 0; border-radius: 22px; position: relative; overflow: hidden; background: linear-gradient(180deg, #17485A 0%, #B9654E 44%, #F7B98A 58%);"><span style="position: absolute; left: 0; right: 0; top: 67px; bottom: 0; background: linear-gradient(180deg, #0F3E48, #06191E);"></span><span style="position: absolute; left: 35px; top: 30px; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(180deg, #FFE7BC, #FF6A3D);"></span></span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">Low Tide Radio</span>
          <span style="display: block; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.7);">Marisol Vey · AirPlay from iPhone</span>
          <span style="display: block; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.22); margin-top: 16px; overflow: hidden;"><span style="display: block; height: 6px; width: {{musicPct}}%; background: #fff; border-radius: 3px; transition: width 1s linear;"></span></span>
        </span>
        <span style="display: flex; align-items: center; gap: 4px;">
          <button type="button" aria-label="Previous" style="width: 52px; height: 52px; border: 0; background: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 9.2a1.4 1.4 0 0 0-2.1-1.2l-9.5 6.8a1.5 1.5 0 0 0 0 2.4l9.5 6.8a1.4 1.4 0 0 0 2.1-1.2z"/><path d="M29 9.2a1.4 1.4 0 0 0-2.1-1.2l-9.5 6.8a1.5 1.5 0 0 0 0 2.4l9.5 6.8a1.4 1.4 0 0 0 2.1-1.2z"/></svg></button>
          <button type="button" aria-label="Pause" style="width: 60px; height: 60px; border: 0; background: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="36" height="36" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="6.4" height="22" rx="1.8"/><rect x="18.6" y="5" width="6.4" height="22" rx="1.8"/></svg></button>
          <button type="button" aria-label="Next" style="width: 52px; height: 52px; border: 0; background: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M3 9.2a1.4 1.4 0 0 1 2.1-1.2l9.5 6.8a1.5 1.5 0 0 1 0 2.4l-9.5 6.8A1.4 1.4 0 0 1 3 22.8z"/><path d="M16 9.2a1.4 1.4 0 0 1 2.1-1.2l9.5 6.8a1.5 1.5 0 0 1 0 2.4l-9.5 6.8a1.4 1.4 0 0 1-2.1-1.2z"/></svg></button>
        </span>
      </div>
    </sc-if>

    <!-- EXPANDED: Timer -->
    <sc-if value="{{e.timer}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; padding: 18px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; opacity: {{expandedOpacity}}; transition: opacity 0.25s ease 0.15s;">
        <span>
          <span style="display: block; font-size: 16px; font-weight: 700; color: #FFB340;">Pasta</span>
          <span style="display: block; font-size: 64px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: #FF9F0A; font-variant-numeric: tabular-nums;">{{timerLeft}}</span>
        </span>
        <span style="display: flex; gap: 12px;">
          <button type="button" aria-label="Pause timer" style="width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; background: #FF9F0A; color: #2A1200; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5h3.4v15H7zM13.6 4.5H17v15h-3.6z"/></svg></button>
          <button type="button" aria-label="Cancel timer" style="width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(255,255,255,0.18); color: #fff; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </span>
      </div>
    </sc-if>

    <!-- EXPANDED: Doorbell -->
    <sc-if value="{{e.door}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; padding: 18px; box-sizing: border-box; display: flex; gap: 18px; opacity: {{expandedOpacity}}; transition: opacity 0.25s ease 0.15s;">
        <span style="width: 230px; flex-shrink: 0; border-radius: 26px; position: relative; overflow: hidden; background: linear-gradient(180deg, #2B3340 0%, #1A1F28 60%, #3A3229 100%);">
          <span style="position: absolute; left: 86px; top: 22px; width: 58px; height: 130px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #5A4636, #3B2D22);"></span>
          <span style="position: absolute; left: 150px; top: 40px; width: 14px; height: 14px; border-radius: 50%; background: #FFD27A; box-shadow: 0 0 22px 8px rgba(255,200,110,0.55);"></span>
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(180deg, #4A4036, #2C251F);"></span>
          <span style="position: absolute; left: 10px; top: 10px; height: 22px; padding: 0 8px; border-radius: 11px; display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; background: rgba(0,0,0,0.55);"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FF453A;"></span>LIVE</span>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 4px 2px 0;">
          <span>
            <span style="display: block; font-size: 14px; font-weight: 700; color: #FFB340;">Front door · now</span>
            <span style="display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px;">Someone’s at the door</span>
          </span>
          <span style="display: flex; gap: 10px;">
            <button type="button" style="height: 48px; padding: 0 20px; border-radius: 24px; border: 0; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 700; color: #04210E; background: #30D158;">Talk</button>
            <button type="button" style="height: 48px; padding: 0 18px; border-radius: 24px; border: 0; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.18);">Unlock</button>
            <button type="button" onClick="{{collapse}}" style="height: 48px; padding: 0 18px; border-radius: 24px; border: 0; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.18);">Dismiss</button>
          </span>
        </span>
      </div>
    </sc-if>

    <!-- EXPANDED: Incoming call -->
    <sc-if value="{{e.call}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; padding: 18px 24px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; opacity: {{expandedOpacity}}; transition: opacity 0.25s ease 0.15s;">
        <span style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(160deg, #FF6A88, #FF375F); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800;">M</span>
        <span style="flex: 1;">
          <span style="display: block; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.65);">Video call</span>
          <span style="display: block; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;">Maya</span>
        </span>
        <button type="button" aria-label="Decline" onClick="{{collapse}}" style="width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer; background: #FF453A; color: #fff; display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="transform: rotate(135deg);"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
        <button type="button" aria-label="Accept" onClick="{{collapse}}" style="width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer; background: #30D158; color: #fff; display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h9A1.5 1.5 0 0 1 15 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 3 16.5zM16 10.5l4.2-2.6a.5.5 0 0 1 .8.4v7.4a.5.5 0 0 1-.8.4L16 13.5z"/></svg></button>
      </div>
    </sc-if>

    <!-- Tap the compact island to expand it -->
    <sc-if value="{{canExpand}}" hint-placeholder-val="{{ true }}">
      <button type="button" aria-label="Expand island" onClick="{{expand}}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; cursor: pointer;"></button>
    </sc-if>
  </div>

  <!-- Second activity: splits off as its own bead -->
  <button type="button" aria-label="Timer {{timerLeft}}" onClick="{{openTimer}}" style="position: absolute; top: 12px; left: {{bubbleX}}px; width: 44px; height: 44px; border-radius: 22px; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: {{skin.bg}}; border: {{skin.border}}; backdrop-filter: {{skin.blur}}; -webkit-backdrop-filter: {{skin.blur}}; box-shadow: {{skin.shadow}}; overflow: hidden; opacity: {{bubbleOpacity}}; transform: scale({{bubbleScale}}); transition: left 0.6s cubic-bezier(0.3, 1.32, 0.5, 1), opacity 0.3s ease, transform 0.5s cubic-bezier(0.3, 1.5, 0.5, 1);">
    <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="10.5" fill="none" stroke="rgba(255,159,10,0.3)" stroke-width="3.5"/><circle cx="14" cy="14" r="10.5" fill="none" stroke="#FF9F0A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="{{timerDash}} 66" transform="rotate(-90 14 14)"/></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","default":"Story","options":["Story","Timer","Music + timer","Assistant","Doorbell","Call","Now Playing expanded"]},"look":{"editor":"enum","default":"Liquid Glass","options":["Liquid Glass","Black"]},"background":{"editor":"enum","default":"Glass clock","options":["Glass clock","Analog","Photos"]},"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.t0 = Date.now(); this.timer = setInterval(() => this.setState({ t: Date.now() }), 100); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const st = this.state || {};
    const now = Date.now();
    const t0 = this.t0 || now;
    const el = now - t0;
    const scene = this.props.scene ?? 'Story';
    // what the island is showing: main compact activity, optional second bead, optional expansion
    let main = 'timer', bead = null, exp = null;
    const story = (el % 26000) / 1000;
    const pick = scene === 'Story'
      ? (story < 4 ? 'Timer' : story < 9 ? 'Music + timer' : story < 14 ? 'Doorbell' : story < 17 ? 'Music + timer' : story < 21 ? 'Assistant' : 'Call')
      : scene;
    if (pick === 'Timer') { main = 'timer'; }
    if (pick === 'Music + timer') { main = 'music'; bead = 'timer'; }
    if (pick === 'Assistant') { main = 'assistant'; bead = 'timer'; }
    if (pick === 'Doorbell') { main = 'music'; exp = 'door'; }
    if (pick === 'Call') { main = 'music'; exp = 'call'; }
    if (pick === 'Now Playing expanded') { main = 'music'; bead = 'timer'; exp = 'music'; }
    if (st.userExp && !exp) exp = st.userExp;
    if (st.dismissedAt && now - st.dismissedAt < 5000 && (exp === 'door' || exp === 'call')) exp = null;
    const sizes = { timer: [230, 44], music: [250, 44], assistant: [220, 44] };
    const expSizes = { music: [660, 160, 48], timer: [460, 120, 44], door: [640, 196, 50], call: [580, 116, 58] };
    let w, h, r;
    if (exp) { [w, h, r] = expSizes[exp]; } else { [w, h] = sizes[main]; r = 22; }
    const left = Math.max(0, 7 * 60 + 42 - el / 1000);
    const t = now / 1000;
    const look = this.props.look ?? 'Liquid Glass';
    const skin = look === 'Black'
      ? { bg: '#000', border: '0.5px solid rgba(255,255,255,0.14)', blur: 'none', shadow: '0 10px 30px rgba(0,0,0,0.55)', specular: 'none' }
      : { bg: 'rgba(18,18,24,0.42)', border: '0.5px solid rgba(255,255,255,0.28)', blur: 'blur(20px) saturate(1.9) brightness(0.9)', shadow: 'inset 0 1.5px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(255,255,255,0.08), 0 14px 40px rgba(0,0,0,0.5)', specular: 'linear-gradient(170deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.02) 40%, rgba(255,255,255,0) 70%)' };
    const bgName = this.props.background ?? 'Glass clock';
    const colors = ['#64D2FF', '#BF5AF2', '#FF375F', '#FF9F0A', '#64D2FF', '#BF5AF2'];
    return {
      bg: { glass: bgName === 'Glass clock', analog: bgName === 'Analog', photos: bgName === 'Photos' },
      w, h, r, ml: -w / 2,
      skin,
      islandOpacity: 1,
      isExpanded: !!exp,
      canExpand: !exp,
      compactOpacity: exp ? 0 : 1,
      expandedOpacity: exp ? 1 : 0,
      c: { timer: main === 'timer', music: main === 'music', assistant: main === 'assistant' },
      e: { music: exp === 'music', timer: exp === 'timer', door: exp === 'door', call: exp === 'call' },
      timerLeft: Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0'),
      timerDash: (66 * left / 600).toFixed(1),
      musicPct: (36 + (el / 1000) / 2.27 % 64).toFixed(1),
      eq: [0, 1, 2, 3, 4].map(i => (6 + 16 * Math.abs(Math.sin(t * (3.1 + i * 0.9) + i))).toFixed(1)),
      eqA: [0, 1, 2, 3, 4, 5].map(i => ({ h: (5 + 17 * Math.abs(Math.sin(t * (5.3 + i * 1.1) + i * 2))).toFixed(1), c: colors[i] })),
      spin: ((t * 140) % 360).toFixed(0),
      bubbleX: 480 + w / 2 + 8,
      bubbleOpacity: bead && !exp ? 1 : 0,
      bubbleScale: bead && !exp ? 1 : 0.4,
      expand: () => this.setState({ userExp: main === 'assistant' ? null : main }),
      collapse: () => this.setState({ userExp: null, dismissedAt: Date.now() }),
      openTimer: () => this.setState({ userExp: 'timer' })
    };
  }
}
</script>
</body>
</html>
