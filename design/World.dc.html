<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandBy World clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- Dotted world map; dots in daylight glow, night side stays dim -->
  <sc-for list="{{dots}}" as="dt" hint-placeholder-count="200">
    <div style="position: absolute; left: {{dt.x}}px; top: {{dt.y}}px; width: 5px; height: 5px; border-radius: 50%; background: {{dt.c}};"></div>
  </sc-for>

  <!-- Clock-app time zones -->
  <sc-for list="{{zones}}" as="z" hint-placeholder-count="3">
    <div style="position: absolute; left: {{z.x}}px; top: {{z.y}}px; display: flex; align-items: center; gap: 6px;">
      <div style="width: 9px; height: 9px; border-radius: 50%; background: {{zoneColor}}; box-shadow: 0 0 0 3px rgba(0,0,0,0.85);"></div>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: -0.01em; color: {{fg2}}; text-shadow: 0 0 6px #000, 0 0 2px #000; white-space: nowrap; font-variant-numeric: tabular-nums;">{{z.label}}</div>
    </div>
  </sc-for>

  <!-- You are here -->
  <div style="position: absolute; left: {{here.x}}px; top: {{here.y}}px; width: 28px; height: 28px; border-radius: 50%; background: {{hereHalo}};"></div>
  <div style="position: absolute; left: {{here.x2}}px; top: {{here.y2}}px; width: 12px; height: 12px; border-radius: 50%; background: {{fg}}; box-shadow: 0 0 0 2.5px {{hereRing}};"></div>

  <!-- Top-left: alarm, then location -->
  <div style="position: absolute; left: 40px; top: 30px; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 7px; color: {{fg2}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>
      </svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.015em; font-variant-numeric: tabular-nums;">7:00 AM</span>
    </div>
    <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.015em; color: {{fg}};">Santa Cruz</div>
  </div>

  <!-- Bottom-left: the time -->
  <div style="position: absolute; left: 36px; bottom: 26px; font-size: 136px; font-weight: 600; line-height: 0.8; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; color: {{fg}}; white-space: nowrap;">{{time}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"live":{"editor":"boolean","default":true},"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  // 96 x 36 land mask, 3.75° per dot, left edge at 157.5°E, top row at 76°N
  rows() {
    return ['000007df83ff0000040ffd14','ec1fbfeff1ff001e0affffff','ff3fffff38f8c07fffffffff','fc3ffffd78e080ffffffffff','c03cfff8780001effffffffe','80001fff7c000cffffffffe1','00000ffffe0017fffffffff0','00000ffffb0007ffffffffe0','000007fff0000ffcffffffd8','000007ffe0001c3fffffff90','000007ffc0000f87fffffdb0','000003ff80001fd1fffffe40','000001fd80001ffffffffe00','000000f080003ffff3fffc00','00000032c0007ffffc7ff800','0000003e00007fff7879e200','0000000700007fffe030e200','000000013c003ffff0302300','000000007e001fffe0108700','000000007f8000ffe000cc00','00000000ffc000ffc000dc40','00000000fff0007f8000627a','000000007ff8007f8000101c','000000007ff0007f80000040','000000003ff0007fb00001f8','000000001fe0007f200007fc','000000001fe0003f60000ffe','000000001f80003e00000ffe','000000001f80001c00000ffe','000000001f0000180000063c','080000003e0000000000000c','100000003800000000000004','300000003000000000000000','000000003000000000000000','000000003000000000000000','000000000000000000000000'];
  }
  proj(lat, lon) {
    const x = (((lon - 157.5) % 360) + 360) % 360 / 3.75 * 10;
    const y = 64 + (76 - lat) / 3.75 * 10;
    return { x, y };
  }
  land() {
    if (this._land) return this._land;
    const pts = [];
    this.rows().forEach((hex, r) => {
      for (let i = 0; i < hex.length; i++) {
        const nib = parseInt(hex[i], 16);
        for (let b = 0; b < 4; b++) {
          if (nib & (8 >> b)) {
            const c = i * 4 + b;
            pts.push({ c, r, lat: 76 - (r + 0.5) * 3.75, lon: 157.5 + (c + 0.5) * 3.75 });
          }
        }
      }
    });
    this._land = pts;
    return pts;
  }
  renderVals() {
    const live = this.props.live ?? true;
    const d = new Date();
    if (!live) d.setHours(9, 41, 0, 0);
    const night = this.props.night ?? false;
    const fg = night ? '#BE180E' : '#FFFFFF';
    const key = (night ? 'n' : 'd') + Math.floor(d.getTime() / 60000);
    if (this._dotsKey !== key) {
      const start = Date.UTC(d.getUTCFullYear(), 0, 0);
      const doy = (d.getTime() - start) / 86400000;
      const decl = -23.44 * Math.cos(2 * Math.PI / 365 * (doy + 10)) * Math.PI / 180;
      const utcH = d.getUTCHours() + d.getUTCMinutes() / 60;
      const sunLon = -15 * (utcH - 12);
      this._dots = this.land().map(p => {
        const la = p.lat * Math.PI / 180, dl = (p.lon - sunLon) * Math.PI / 180;
        const cz = Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(dl);
        const k = Math.min(1, Math.max(0, (cz + 0.1) / 0.2));
        const lit = k * k * (3 - 2 * k);
        const x = p.c * 10 + 2.5, y = 64 + p.r * 10 + 2.5;
        const underText = (x < 300 && y < 96) || (x < 400 && y > 336);
        let a = 0.2 + 0.72 * lit;
        if (underText) a *= 0.35;
        const c = night ? 'rgba(190,24,14,' + (a * 0.8).toFixed(2) + ')'
                        : 'rgba(' + Math.round(150 + 105 * lit) + ',' + Math.round(150 + 100 * lit) + ',' + Math.round(160 + 70 * lit) + ',' + a.toFixed(2) + ')';
        return { x: x.toFixed(0), y: y.toFixed(0), c };
      });
      this._dotsKey = key;
    }
    const fmt = (tz) => d.toLocaleTimeString('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' });
    const zoneList = [
      { city: 'New York', tz: 'America/New_York', lat: 40.71, lon: -74.0 },
      { city: 'London', tz: 'Europe/London', lat: 51.5, lon: -0.13 },
      { city: 'Hyderabad', tz: 'Asia/Kolkata', lat: 17.39, lon: 78.49 }
    ];
    const zones = zoneList.map(z => {
      const p = this.proj(z.lat, z.lon);
      return { x: (p.x - 4.5).toFixed(0), y: (p.y - 4.5 - 1).toFixed(0), label: z.city + ' ' + (live ? fmt(z.tz) : '') };
    });
    const hp = this.proj(36.97, -122.03);
    const h12 = d.getHours() % 12 || 12;
    return {
      dots: this._dots,
      zones,
      here: { x: (hp.x - 14).toFixed(0), y: (hp.y - 14).toFixed(0), x2: (hp.x - 6).toFixed(0), y2: (hp.y - 6).toFixed(0) },
      hereHalo: night ? 'rgba(190,24,14,0.25)' : 'rgba(255,159,10,0.28)',
      hereRing: night ? '#000' : '#FF9F0A',
      zoneColor: night ? '#BE180E' : '#FF9F0A',
      fg,
      fg2: night ? '#BE180E' : 'rgba(255,255,255,0.72)',
      time: h12 + ':' + String(d.getMinutes()).padStart(2, '0')
    };
  }
}
</script>
</body>
</html>
