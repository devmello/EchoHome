<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandBy Solar clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: {{bg}}; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- Corona -->
  <div aria-hidden="true" style="position: absolute; left: 190px; top: -120px; width: 1220px; height: 1220px; border-radius: 50%; background: {{corona}};"></div>
  <!-- Flare streak along the horizon -->
  <div aria-hidden="true" style="position: absolute; left: 260px; top: 452px; width: 1000px; height: 6px; border-radius: 3px; background: {{streak}}; filter: blur(3px);"></div>
  <!-- The sun, rising off the lower-right edge -->
  <div aria-hidden="true" style="position: absolute; left: 570px; top: 250px; width: 460px; height: 460px; border-radius: 50%; background: {{disc}}; box-shadow: {{discGlow}};"></div>

  <!-- Time block -->
  <div style="position: absolute; left: 56px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px;">
    <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: {{dateColor}};">{{dateLine}}</div>
    <div style="font-size: 196px; font-weight: 400; line-height: 0.82; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: {{fg}}; white-space: nowrap; margin-left: -8px;">{{time}}</div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; color: {{fg2}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>
      </svg>
      <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.015em; font-variant-numeric: tabular-nums;">7:00 AM</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"color":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#FF453A","#FF375F","#BF5AF2","#0A84FF","#64D2FF","#30D158"]},"night":{"editor":"boolean","default":false},"live":{"editor":"boolean","default":true},"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  rgb(hex) {
    let h = String(hex || '#FF9F0A').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  mix(hex, to, t, a) {
    const p = this.rgb(hex), q = to === 'white' ? [255, 255, 255] : [0, 0, 0];
    const c = p.map((v, i) => Math.round(v + (q[i] - v) * t));
    return 'rgba(' + c.join(',') + ',' + (a ?? 1) + ')';
  }
  renderVals() {
    const live = this.props.live ?? true;
    const d = new Date();
    if (!live) d.setHours(9, 41, 0, 0);
    const night = this.props.night ?? false;
    const ac = night ? '#7A0D07' : (this.props.color ?? '#FF9F0A');
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const h12 = d.getHours() % 12 || 12;
    return {
      time: h12 + ':' + String(d.getMinutes()).padStart(2, '0'),
      dateLine: days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate(),
      bg: 'radial-gradient(ellipse 80% 90% at 85% 100%, ' + this.mix(ac, 'black', 0.72) + ' 0%, #000 70%)',
      corona: 'radial-gradient(circle, ' + this.mix(ac, 'white', 0.1, night ? 0.35 : 0.55) + ' 0%, ' + this.mix(ac, 'black', 0.2, 0.22) + ' 22%, ' + this.mix(ac, 'black', 0.4, 0.06) + ' 42%, rgba(0,0,0,0) 60%)',
      disc: 'radial-gradient(circle at 50% 50%, ' + (night ? this.mix(ac, 'white', 0.15) : this.mix(ac, 'white', 0.85)) + ' 0%, ' + this.mix(ac, 'white', night ? 0.05 : 0.45) + ' 30%, ' + this.mix(ac, 'black', 0) + ' 62%, ' + this.mix(ac, 'black', 0.25) + ' 100%)',
      discGlow: '0 0 60px 10px ' + this.mix(ac, 'white', 0.2, night ? 0.3 : 0.55) + ', 0 0 160px 40px ' + this.mix(ac, 'black', 0, 0.35),
      streak: 'linear-gradient(90deg, rgba(0,0,0,0), ' + this.mix(ac, 'white', 0.6, night ? 0.25 : 0.7) + ' 45%, rgba(0,0,0,0))',
      fg: night ? '#BE180E' : '#FFFFFF',
      fg2: night ? '#BE180E' : 'rgba(255,255,255,0.72)',
      dateColor: night ? '#BE180E' : this.mix(ac, 'white', 0.35)
    };
  }
}
</script>
</body>
</html>
