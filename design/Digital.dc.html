<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandBy Digital clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, 'SF Pro Display', 'Inter', BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; box-sizing: border-box; padding: 0 44px 0 40px; gap: 28px;">

  <!-- Time: the hero, tinted with the chosen color -->
  <div style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: {{timeJustify}}; height: 100%;">
    <div style="font-size: 252px; font-weight: 600; line-height: 0.8; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; white-space: nowrap; color: {{fg}}; display: flex; align-items: center;">
      <span>{{hh}}</span><span style="margin: 0 0.01em; transform: translateY(-0.05em);">:</span><span>{{mm}}</span>
    </div>
  </div>

  <!-- Complications column (iOS 27.3 style: date, weather, alarm) -->
  <sc-if value="{{showComplications}}" hint-placeholder-val="{{ true }}">
  <div style="width: 168px; flex-shrink: 0; display: flex; flex-direction: column; gap: 30px;">

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 17px; font-weight: 700; letter-spacing: 0.06em; color: {{fg}};">{{dayShort}}</div>
      <div style="font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: {{fg2}};">{{dayNum}}</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 10px; color: {{fg2}};">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16.5 3.5a6 6 0 0 0 4 7.5 6 6 0 0 1-8.2-1.7"/>
          <path d="M7 20h9.5a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 7 20z"/>
        </svg>
        <span style="font-size: 36px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">54°</span>
      </div>
      <div style="font-size: 15px; font-weight: 500; color: {{fg3}}; font-variant-numeric: tabular-nums;">H:61°  L:47°</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; color: {{fg2}};">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>
      </svg>
      <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">7:00 AM</span>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"color":{"editor":"color","default":"#FFFFFF","options":["#FFFFFF","#FF453A","#FF9F0A","#FFD60A","#30D158","#64D2FF","#0A84FF","#BF5AF2"]},"complications":{"editor":"boolean","default":true},"night":{"editor":"boolean","default":false},"live":{"editor":"boolean","default":true},"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  rgba(hex, a) {
    let h = String(hex || '#FFFFFF').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  renderVals() {
    const live = this.props.live ?? true;
    const d = new Date();
    if (!live) d.setHours(9, 41, 0, 0);
    const night = this.props.night ?? false;
    const color = night ? '#BE180E' : (this.props.color ?? '#FFFFFF');
    const h12 = d.getHours() % 12 || 12;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    return {
      hh: String(h12),
      mm: String(d.getMinutes()).padStart(2, '0'),
      dayShort: days[d.getDay()],
      dayNum: String(d.getDate()),
      fg: color,
      fg2: night ? color : this.rgba(color, 0.92),
      fg3: night ? color : this.rgba(color, 0.6),
      showComplications: this.props.complications ?? true,
      timeJustify: (this.props.complications ?? true) ? 'flex-start' : 'center'
    };
  }
}
</script>
</body>
</html>
